<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS – 101 CONSEILS</title>
</head>
<body>
  <!-- Initialisation fiable du widget Identity (invite/recovery) -->
  <script>
    // Appelée quand le script Identity est chargé
    window.__initNI = function () {
      var ni = window.netlifyIdentity;
      if (!ni) return;

      // Si on arrive avec un token #invite_token=... ou #recovery_token=...
      var hasToken = /invite_token=|recovery_token=/.test(location.hash);

      ni.on('init', function () {
        if (hasToken) ni.open(); // ouvre la modale pour définir le mot de passe
      });

      ni.init();
    };
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"
          onload="window.__initNI()"></script>

  <!-- Netlify CMS -->
  <script src="https://unpkg.com/netlify-cms@^2.10.0/dist/netlify-cms.js"></script>
</body>
</html>
